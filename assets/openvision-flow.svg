<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">How OpenVision connects your project to the model you choose</title>
  <desc id="d">Your project stays on your machine. OpenVision runs locally with a local profile and keeps API keys in the operating system keyring. Requests go only to the AI provider you configure: an OpenAI-compatible API, your own server or a local model. Dots travel along the connections; motion stops when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081217"/><stop offset="1" stop-color="#0f2629"/></linearGradient>
    <linearGradient id="mint" x2="1"><stop stop-color="#8affe3"/><stop offset="1" stop-color="#2fb6bb"/></linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif; }
      .wire { stroke: #2b5a58; stroke-width: 2; fill: none; }
      .dot { fill: #83ffe1; }
      .d1 { offset-path: path('M330 160 H540'); animation: go 2.6s linear infinite; }
      .d2 { offset-path: path('M540 176 H330'); animation: go 2.6s linear infinite 1.3s; }
      .d3 { offset-path: path('M740 160 H950'); animation: go 2.6s linear infinite .6s; }
      .d4 { offset-path: path('M950 176 H740'); animation: go 2.6s linear infinite 1.9s; }
      .core { transform-box: fill-box; transform-origin: center; animation: breathe 4s ease-in-out infinite; }
      .lock { animation: shine 4s ease-in-out infinite; }
      @keyframes go { 0% { offset-distance: 0%; opacity: 0; } 10%, 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
      @keyframes breathe { 0%, 100% { opacity: .5; transform: scale(1); } 50% { opacity: .9; transform: scale(1.06); } }
      @keyframes shine { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .dot, .core, .lock { animation: none; } .dot { opacity: 0; } }
    </style>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)" stroke="#21414a"/>

  <path class="wire" d="M330 160 H540"/><path class="wire" d="M330 176 H540" stroke-dasharray="4 6"/>
  <path class="wire" d="M740 160 H950"/><path class="wire" d="M740 176 H950" stroke-dasharray="4 6"/>
  <circle class="dot d1" r="5"/><circle class="dot d2" r="4" opacity=".7"/>
  <circle class="dot d3" r="5"/><circle class="dot d4" r="4" opacity=".7"/>

  <!-- project -->
  <g transform="translate(70 70)">
    <rect width="260" height="180" rx="18" fill="#0f2126" stroke="#2a4a50"/>
    <path d="M28 40h34l10 10h50v54H28z" fill="none" stroke="#9fc4c2" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="28" y="140" font-size="20" font-weight="650" fill="#eaf6f3">Your project</text>
    <text x="28" y="163" font-size="13.5" fill="#8fb0b3">Files, Git, terminals, rules</text>
    <text x="150" y="76" font-size="12.5" fill="#6f9497">src/</text><text x="150" y="96" font-size="12.5" fill="#6f9497">.openvision/</text>
  </g>

  <!-- core -->
  <g transform="translate(540 50)">
    <rect class="core" x="-8" y="-8" width="216" height="216" rx="26" fill="none" stroke="#46d9c0" stroke-opacity=".5"/>
    <rect width="200" height="200" rx="22" fill="#0f2a2c" stroke="#2f6661"/>
    <g transform="translate(48 36)">
      <path d="M2 30c12-18 27-27 50-27s38 9 50 27c-12 18-27 27-50 27S14 48 2 30z" fill="none" stroke="url(#mint)" stroke-width="6" stroke-linejoin="round"/>
      <path fill="#eefaf6" d="m52 13 15 9v17l-15 9-15-9V22z"/><path fill="#0b171d" d="m52 23 7 4v8l-7 4-7-4v-8z"/>
    </g>
    <text x="100" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#eefaf6">OpenVision</text>
    <text x="100" y="150" text-anchor="middle" font-size="13" fill="#9cc6c2">Local profile · no account</text>
    <g class="lock" transform="translate(52 164)">
      <rect width="96" height="24" rx="12" fill="#143a36" stroke="#2f7a6a"/>
      <path d="M16 11v-2.5a4 4 0 0 1 8 0V11" stroke="#8ff0d0" stroke-width="1.8" fill="none"/><rect x="13.5" y="11" width="13" height="8" rx="2" fill="#8ff0d0"/>
      <text x="33" y="16.5" font-size="11.5" fill="#bff5e2">OS keyring</text>
    </g>
  </g>

  <!-- providers -->
  <g transform="translate(950 70)">
    <rect width="260" height="180" rx="18" fill="#0f2126" stroke="#2a4a50"/>
    <text x="28" y="44" font-size="20" font-weight="650" fill="#eaf6f3">Your AI provider</text>
    <g font-size="13.5" fill="#bfd6d6">
      <rect x="28" y="62" width="204" height="28" rx="8" fill="#11292e" stroke="#2a4b50"/><text x="42" y="81">OpenAI-compatible API</text>
      <rect x="28" y="98" width="204" height="28" rx="8" fill="#11292e" stroke="#2a4b50"/><text x="42" y="117">Your own server</text>
      <rect x="28" y="134" width="204" height="28" rx="8" fill="#11292e" stroke="#2a4b50"/><text x="42" y="153">Local model (127.0.0.1)</text>
    </g>
  </g>

  <g font-size="13" fill="#7fa3a6" text-anchor="middle">
    <text x="435" y="146">context you send</text>
    <text x="845" y="146">your key, your model</text>
    <text x="640" y="296">No telemetry · keys never written to project files · requests only to providers you configure</text>
  </g>
</svg>
