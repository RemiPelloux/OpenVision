<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title description">
  <title id="title">OpenVision — your workspace, your models</title>
  <desc id="description">A mint green eye blinks gently over a dark workspace. A light moves along connection lines. Animation stops when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b171d"/><stop offset="1" stop-color="#122c31"/></linearGradient>
    <linearGradient id="mint"><stop stop-color="#83ffe1"/><stop offset="1" stop-color="#36b9be"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#46d9c0" stop-opacity=".16"/><stop offset="1" stop-color="#46d9c0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#89c9c3" stroke-opacity=".055"/></pattern>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .eye { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; }
      .iris { animation: glance 12s ease-in-out infinite; }
      .signal { stroke-dasharray: 28 380; animation: travel 8s linear infinite; }
      .cursor { animation: caret 2s steps(1) infinite; }
      @keyframes blink { 0%, 41%, 46%, 100% { transform: scaleY(1); } 43%, 44% { transform: scaleY(.07); } }
      @keyframes glance { 0%, 20%, 60%, 100% { transform: translateX(0); } 30%, 45% { transform: translateX(9px); } 75%, 85% { transform: translateX(-7px); } }
      @keyframes travel { to { stroke-dashoffset: -408; } }
      @keyframes caret { 0%, 65%, 100% { opacity: 1; } 66%, 99% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .eye, .iris, .signal, .cursor { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="460" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="458" rx="23" fill="url(#grid)" stroke="#254247"/>
  <circle cx="975" cy="218" r="240" fill="url(#halo)"/>
  <g transform="translate(64 62)">
    <rect width="196" height="28" rx="14" fill="#193c3d"/>
    <circle cx="17" cy="14" r="4" fill="#83ffe1"/>
    <text x="31" y="19" font-size="11" letter-spacing="1.7" fill="#b9ede0">DEVELOPMENT PREVIEW</text>
    <text y="112" font-size="72" font-weight="700" letter-spacing="-3" fill="#eefaf6">OpenVision<tspan fill="#6ee6ce">.</tspan></text>
    <text y="164" font-size="28" fill="#c0d8d8">Your workspace. Your models.</text>
    <text y="205" font-size="17" fill="#8fadb1">Code, explore and build with the AI you choose.</text>
    <g transform="translate(0 254)" font-size="13" fill="#b5cbcc">
      <rect width="104" height="33" rx="8" fill="#132c32" stroke="#2c4a4f"/>
      <text x="16" y="22">Local profile</text>
      <rect x="116" width="124" height="33" rx="8" fill="#132c32" stroke="#2c4a4f"/>
      <text x="133" y="22">Custom AI APIs</text>
      <rect x="252" width="124" height="33" rx="8" fill="#132c32" stroke="#2c4a4f"/>
      <text x="269" y="22">Your projects</text>
    </g>
    <text y="330" font-size="12" letter-spacing="1.1" fill="#74979c">EDITABLE CUSTOMIZATION SOURCE · BUILT FOR EXPLORATION</text>
  </g>
  <g fill="none" stroke="#30595c" stroke-width="1.5">
    <path d="M742 125H806L844 163M742 335H806L844 297M1104 163L1142 125H1200M1104 297L1142 335H1200"/>
    <path class="signal" stroke="#76e7cf" d="M742 125H806L844 163M1104 297L1142 335H1200"/>
    <circle cx="974" cy="230" r="154" stroke-opacity=".55"/>
    <circle cx="974" cy="230" r="136" stroke-dasharray="2 11"/>
  </g>
  <g class="eye">
    <path d="M850 230Q974 80 1098 230Q974 380 850 230Z" fill="#132e33" stroke="url(#mint)" stroke-width="7" stroke-linejoin="round"/>
    <g class="iris">
      <path d="M974 181L1016 205V255L974 279L932 255V205Z" fill="url(#mint)"/>
      <path d="M974 210L991 220V240L974 250L957 240V220Z" fill="#0e242b"/>
      <circle cx="986" cy="214" r="5" fill="#eafff8"/>
    </g>
  </g>
  <path d="M974 56V70M974 390V404" stroke="#eab568" stroke-width="4" stroke-linecap="round"/>
  <g font-size="12" fill="#9ec9c7">
    <text x="751" y="110">PROJECT</text><text x="1127" y="110">MODEL</text>
    <text x="751" y="358">CONTEXT</text><text x="1127" y="358">TOOLS</text>
  </g>
  <rect class="cursor" x="1200" y="349" width="6" height="12" fill="#75e8d0"/>
</svg>
