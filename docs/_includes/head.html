<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b171d">
{% seo %}
<link rel="icon" href="{{ '/assets/img/openvision.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<script>
  // Apply the saved or preferred theme before first paint.
  (function () {
    try {
      var saved = localStorage.getItem('ov-theme');
      var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  })();
</script>
<script defer src="{{ '/assets/site.js' | relative_url }}" data-base="{{ site.baseurl }}" data-repo="{{ site.repo_url }}"></script>
