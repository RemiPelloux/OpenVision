<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="580 50 660 460" role="img" aria-labelledby="t d">
  <title id="t">OpenVision editor with the Agent and Tab completion</title>
  <desc id="d">An AI coding workspace. In an editor window, code types itself, Tab completes a line, an agent proposes a change and it is applied, while the model picker cycles through the providers you configure. The OpenVision eye blinks. Motion stops when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081217"/><stop offset=".55" stop-color="#0d1f24"/><stop offset="1" stop-color="#11302f"/></linearGradient>
    <linearGradient id="mint" x2="1"><stop stop-color="#8affe3"/><stop offset="1" stop-color="#2fb6bb"/></linearGradient>
    <linearGradient id="win" x2="0" y2="1"><stop stop-color="#111f25"/><stop offset="1" stop-color="#0c181d"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop stop-color="#46d9c0" stop-opacity=".22"/><stop offset="1" stop-color="#46d9c0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8fd1ca" stroke-opacity=".05"/></pattern>
    <clipPath id="l1"><rect class="type t1" x="0" y="-14" width="0" height="20"/></clipPath>
    <clipPath id="l2"><rect class="type t2" x="0" y="-14" width="0" height="20"/></clipPath>
    <clipPath id="l3"><rect class="type t3" x="0" y="-14" width="0" height="20"/></clipPath>
    <clipPath id="l4"><rect class="type t4" x="0" y="-14" width="0" height="20"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif; white-space: pre; }
      .mono, .mono text, text.mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .eye { transform-box: fill-box; transform-origin: center; animation: blink 7s infinite; }
      .iris { animation: glance 14s ease-in-out infinite; }
      .float { animation: float 9s ease-in-out infinite; }
      .type { animation: type 12s steps(28) infinite; }
      .t1 { animation-name: type1; } .t2 { animation-name: type2; } .t3 { animation-name: type3; } .t4 { animation-name: type4; }
      .ghost { animation: ghost 12s infinite; }
      .bubble { transform-box: fill-box; transform-origin: left bottom; animation: bubble 12s infinite; }
      .applied { animation: applied 12s infinite; }
      .diff { animation: diff 12s infinite; }
      .m1 { animation: m1 12s infinite; } .m2 { animation: m2 12s infinite; } .m3 { animation: m3 12s infinite; }
      .caret { animation: caret 1.1s steps(1) infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      .flow { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
      @keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } }
      @keyframes glance { 0%, 20%, 60%, 100% { transform: translateX(0); } 30%, 45% { transform: translateX(8px); } 72%, 84% { transform: translateX(-6px); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes type1 { 0% { width: 0; } 10%, 100% { width: 420px; } }
      @keyframes type2 { 0%, 10% { width: 0; } 20%, 100% { width: 420px; } }
      @keyframes type3 { 0%, 20% { width: 0; } 30%, 100% { width: 420px; } }
      @keyframes type4 { 0%, 46% { width: 0; } 50%, 100% { width: 420px; } }
      @keyframes ghost { 0%, 31% { opacity: 0; } 34%, 44% { opacity: .55; } 46%, 100% { opacity: 0; } }
      @keyframes bubble { 0%, 52% { opacity: 0; transform: scale(.85); } 56%, 94% { opacity: 1; transform: scale(1); } 98%, 100% { opacity: 0; } }
      @keyframes diff { 0%, 60% { opacity: 0; } 64%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes applied { 0%, 74% { opacity: 0; } 78%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes m1 { 0%, 30% { opacity: 1; } 33%, 97% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes m2 { 0%, 30% { opacity: 0; } 33%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }
      @keyframes m3 { 0%, 63% { opacity: 0; } 66%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes caret { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .9; transform: scale(1); } 50% { opacity: .35; transform: scale(1.8); } }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      @media (prefers-reduced-motion: reduce) {
        .eye, .iris, .float, .ghost, .bubble, .applied, .diff, .caret, .pulse, .flow, .m1, .m2, .m3 { animation: none; }
        .type { animation: none; width: 420px; }
        .m2, .m3, .ghost { opacity: 0; } .bubble, .diff, .applied { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="558" rx="27" fill="url(#grid)" stroke="#21414a"/>
  <circle cx="930" cy="280" r="330" fill="url(#halo)"/>

  <!-- Left: identity -->
  <g transform="translate(72 84)">
    <g transform="translate(0 -6)">
      <rect width="210" height="30" rx="15" fill="#123134" stroke="#24534f"/>
      <circle class="pulse" cx="18" cy="15" r="4.5" fill="#83ffe1"/>
      <text x="32" y="20" font-size="11.5" letter-spacing="1.8" fill="#b9ede0">DEVELOPMENT PREVIEW</text>
    </g>
    <g transform="translate(0 52)">
      <g class="eye">
        <path d="M2 34c14-20 31-31 50-31s36 11 50 31c-14 20-31 31-50 31S16 54 2 34z" fill="none" stroke="url(#mint)" stroke-width="7" stroke-linejoin="round"/>
        <g class="iris"><path fill="#eefaf6" d="m52 15 17 10v19l-17 10-17-10V25z"/><path fill="#0b171d" d="m52 26 8 4.5v9L52 44l-8-4.5v-9z"/></g>
      </g>
      <text x="124" y="52" font-size="64" font-weight="750" letter-spacing="-2.5" fill="#eefaf6">OpenVision<tspan fill="#6ee6ce">.</tspan></text>
    </g>
    <text y="178" font-size="29" font-weight="600" fill="#d4ebe9">Your workspace. Your models.</text>
    <text y="214" font-size="17.5" fill="#8fb0b3">An AI coding workspace that runs on your machine,</text>
    <text y="238" font-size="17.5" fill="#8fb0b3">with the providers, keys and rules you choose.</text>
    <g transform="translate(0 280)" font-size="13.5" fill="#bfd6d6">
      <rect width="118" height="34" rx="9" fill="#11292e" stroke="#2a4b50"/><text x="16" y="22">No account</text>
      <rect x="130" width="146" height="34" rx="9" fill="#11292e" stroke="#2a4b50"/><text x="146" y="22">Any OpenAI API</text>
      <rect x="288" width="110" height="34" rx="9" fill="#11292e" stroke="#2a4b50"/><text x="304" y="22">No telemetry</text>
      <rect y="46" width="96" height="34" rx="9" fill="#11292e" stroke="#2a4b50"/><text x="16" y="68">AI Agent</text>
      <rect x="108" y="46" width="132" height="34" rx="9" fill="#11292e" stroke="#2a4b50"/><text x="124" y="68">Tab completion</text>
      <rect x="252" y="46" width="68" height="34" rx="9" fill="#11292e" stroke="#2a4b50"/><text x="268" y="68">MCP</text>
      <rect x="332" y="46" width="66" height="34" rx="9" fill="#11292e" stroke="#2a4b50"/><text x="348" y="68">Git</text>
    </g>
  </g>

  <!-- Right: editor window -->
  <g transform="translate(600 70)"><g class="float">
    <rect width="620" height="420" rx="16" fill="url(#win)" stroke="#2a4a50"/>
    <path d="M0 16a16 16 0 0 1 16-16h588a16 16 0 0 1 16 16v26H0z" fill="#0f2228"/>
    <circle cx="22" cy="21" r="5.5" fill="#ff6e6e" opacity=".85"/><circle cx="40" cy="21" r="5.5" fill="#ffc66b" opacity=".85"/><circle cx="58" cy="21" r="5.5" fill="#6fe39c" opacity=".85"/>
    <text x="96" y="26" font-size="12.5" fill="#86a6aa" class="mono">src/cart.ts</text>
    <!-- model picker -->
    <g transform="translate(404 9)">
      <rect width="200" height="24" rx="7" fill="#132d33" stroke="#2c5056"/>
      <circle cx="13" cy="12" r="4" fill="#83ffe1"/>
      <g font-size="12" fill="#cfe7e4" class="mono">
        <text class="m1" x="24" y="16.5">gpt-6.1-sol</text>
        <text class="m2" x="24" y="16.5" opacity="0">deepseek-v4-flash</text>
        <text class="m3" x="24" y="16.5" opacity="0">local · qwen3-coder</text>
      </g>
      <path d="M184 10l4 4 4-4" stroke="#7fa6a7" fill="none" stroke-width="1.6"/>
    </g>
    <!-- gutter -->
    <rect y="42" width="44" height="378" fill="#0c1a1f"/>
    <g font-size="12" fill="#3f6266" class="mono" text-anchor="end">
      <text x="32" y="78">1</text><text x="32" y="104">2</text><text x="32" y="130">3</text><text x="32" y="156">4</text><text x="32" y="182">5</text><text x="32" y="208">6</text>
    </g>
    <!-- code -->
    <g font-size="14.5" class="mono" transform="translate(60 78)">
      <g clip-path="url(#l1)"><text><tspan fill="#c792ea">export function</tspan><tspan fill="#82e0ff"> total</tspan><tspan fill="#d6e5e3">(items: </tspan><tspan fill="#ffcb6b">Item</tspan><tspan fill="#d6e5e3">[]) {</tspan></text></g>
      <g transform="translate(0 26)" clip-path="url(#l2)"><text><tspan fill="#d6e5e3">  </tspan><tspan fill="#c792ea">return</tspan><tspan fill="#d6e5e3"> items.reduce((sum, i) =&gt;</tspan></text></g>
      <g transform="translate(0 52)" clip-path="url(#l3)"><text><tspan fill="#d6e5e3">    sum + i.price * i.qty</tspan></text></g>
      <text class="ghost" x="226" y="52" fill="#9fc4c2" opacity="0">, 0)</text>
      <g transform="translate(0 78)" clip-path="url(#l4)"><text><tspan fill="#d6e5e3">  , </tspan><tspan fill="#f78c6c">0</tspan><tspan fill="#d6e5e3">);</tspan></text></g>
      <text x="0" y="104" fill="#d6e5e3">}</text>
      <rect class="caret" x="70" y="88" width="2" height="18" fill="#83ffe1"/>
    </g>
    <!-- diff hunk -->
    <g class="diff" opacity="0" transform="translate(60 222)" font-size="13">
      <rect x="-12" y="-16" width="556" height="24" rx="5" fill="#3a1c22" opacity=".8"/>
      <text class="mono" fill="#ff9aa2">-   sum + i.price * i.qty</text>
      <rect x="-12" y="10" width="556" height="24" rx="5" fill="#123a2c" opacity=".9"/>
      <text class="mono" y="26" fill="#8ff0b8">+   sum + Math.round(i.price * i.qty * 100) / 100</text>
    </g>
    <!-- agent bubble -->
    <g transform="translate(60 300)"><g class="bubble" opacity="0">
      <rect width="500" height="84" rx="12" fill="#10292e" stroke="#2b5a58"/>
      <circle cx="24" cy="24" r="11" fill="#1c4744"/><path d="M17 24c3-4 4.5-5.5 7-5.5s4 1.5 7 5.5c-3 4-4.5 5.5-7 5.5s-4-1.5-7-5.5z" fill="none" stroke="#83ffe1" stroke-width="1.8"/>
      <text x="44" y="29" font-size="13" font-weight="600" fill="#cfeee8">Agent</text>
      <text x="44" y="51" font-size="13.5" fill="#a9c9c8">Rounding errors on cents. I'll round each line total</text>
      <text x="44" y="70" font-size="13.5" fill="#a9c9c8">before summing. Review the change?</text>
      <g class="applied" opacity="0" transform="translate(372 14)">
        <rect width="114" height="26" rx="13" fill="#163f33" stroke="#2f7a5e"/>
        <path d="M14 13.5l4.5 4.5 8-9" stroke="#8ff0b8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="18" font-size="12.5" fill="#bff5d6">Applied</text>
      </g>
    </g></g>
  </g>

  </g>
</svg>
