name: Platform Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm ci --prefix tooling
      - run: npm run check:desktop
      - run: npm run test:portable
      - name: Shell syntax
        if: runner.os != 'Windows'
        run: sh -n start-openvision.sh import-cursor.sh
